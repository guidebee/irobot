actions:
- name: left_start
  description: Hold the touchpad knob dragged left (pointer 0) -- TouchOrKeyboardInput's
    0.3-of-travel deadzone, matched here by dragging past it toward the left edge.
  events:
  - kind: press
    x: 40
    y: 914
  kind: hold_start
- name: left_stop
  description: Release the left hold (pointer 0).
  events:
  - kind: release
  kind: hold_stop
- name: right_start
  description: Hold the touchpad knob dragged right (pointer 0) -- TouchOrKeyboardInput's
    0.3-of-travel deadzone, matched here by dragging past it toward the right edge.
  events:
  - kind: press
    x: 492
    y: 914
  kind: hold_start
- name: right_stop
  description: Release the right hold (pointer 0).
  events:
  - kind: release
  kind: hold_stop
- name: up_start
  description: Hold the touchpad knob dragged up (pointer 0) -- TouchOrKeyboardInput's
    0.3-of-travel deadzone, matched here by dragging past it toward the up edge.
  events:
  - kind: press
    x: 266
    y: 688
  kind: hold_start
- name: up_stop
  description: Release the up hold (pointer 0).
  events:
  - kind: release
  kind: hold_stop
- name: down_start
  description: Hold the touchpad knob dragged down (pointer 0) -- TouchOrKeyboardInput's
    0.3-of-travel deadzone, matched here by dragging past it toward the down edge.
  events:
  - kind: press
    x: 266
    y: 1140
  kind: hold_start
- name: down_stop
  description: Release the down hold (pointer 0).
  events:
  - kind: release
  kind: hold_stop
- name: jump
  description: Tap Button B (isButtonBPressed -> PlatformerCommand.jumpPressed).
  events:
  - kind: tap
    pointer_id: 1
    x: 2536
    y: 914
  kind: momentary
- name: long_jump
  description: 'Corrected from an earlier version that just held Button B longer (that
    does nothing extra here -- Player.applyJump() gates on the edge-triggered jumpPressed
    and sets gravity once from current `speed`; there is no held/variable-height jump
    in this engine, unlike the generic example in opengym_implementation_plan.md Sec
    7.4 this was first copied from). The real lever is horizontal speed at takeoff,
    so this macro holds right+run long enough to approach the turbo speed cap (50
    frames: +2 speed/frame from 0 to 100), taps jump while at that speed, waits out
    the landing, then releases both -- a self-contained ''run up and take a long jump'',
    safe to call on its own without an already-held direction (if one IS already held
    by a surrounding sequence, prefer plain right_start/run_start + a delay + jump
    instead, as the level_1_1_clear Game Run does, so this macro''s own trailing release
    doesn''t end that outer hold early).'
  events:
  - kind: press
    x: 492
    y: 914
  - kind: press
    pointer_id: 2
    x: 2269
    y: 914
  - kind: wait
    frames: 50
  - kind: tap
    pointer_id: 1
    x: 2536
    y: 914
  - kind: wait
    frames: 20
  - kind: release
  - kind: release
    pointer_id: 2
  kind: macro
- name: fire
  description: Tap Button A (isButtonAPressed -> PlatformerCommand.actionPressed ->
    Player's fireball throw, Fire Mario only). Same physical button as run_start/run_stop
    -- a real touch here always fires AND starts the run hold simultaneously; this
    action exists so a Game Run can script a bare fireball throw without also committing
    to a run hold.
  events:
  - kind: tap
    pointer_id: 2
    x: 2269
    y: 914
  kind: momentary
- name: run_start
  description: Press and hold Button A for turbo speed (isButtonAPressed -> PlatformerCommand.runHeld).
  events:
  - kind: press
    pointer_id: 2
    x: 2269
    y: 914
  kind: hold_start
- name: run_stop
  description: Release Button A, ending the turbo hold.
  events:
  - kind: release
    pointer_id: 2
  kind: hold_stop
