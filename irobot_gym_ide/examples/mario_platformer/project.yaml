  (fire tap / run hold, pointer 2) and Button B (jump tap, pointer 1), including a
  long_jump macro matching the ported Jump()/GoToRight() speed-scaled long-jump mechanic.
  Coordinates derived from GameController.layout() + MarioResourceManager.downscaledTexture()
  at this project''s own 2670x1200 reference resolution -- verify against a live device
  capture before relying on them for real replay/classification.'
